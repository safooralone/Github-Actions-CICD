name: Test and build

on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build Docker image
        run: docker build --tag ec2-cicd-demo:${GITHUB_SHA} --tag ec2-cicd-demo:latest .

      - name: Smoke check Docker image
        run: |
          docker run --detach --rm --name ec2-cicd-demo -p 8000:8000 ec2-cicd-demo:${GITHUB_SHA}
          trap 'docker stop ec2-cicd-demo >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs ec2-cicd-demo
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/api/message | python -c 'import json,sys; assert json.load(sys.stdin)["message"]'

