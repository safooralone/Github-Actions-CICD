name: Test, build, and deploy

on:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build Docker image
        run: docker build --tag ec2-cicd-demo:${GITHUB_SHA} --tag ec2-cicd-demo:latest .

      - name: Smoke check Docker image
        run: |
          docker run --detach --rm --name ec2-cicd-demo -p 8000:8000 ec2-cicd-demo:${GITHUB_SHA}
          trap 'docker stop ec2-cicd-demo >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs ec2-cicd-demo
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/api/message | python -c 'import json,sys; assert json.load(sys.stdin)["message"]'

      - name: Save Docker image for transfer
        run: docker save ec2-cicd-demo:${GITHUB_SHA} -o ec2-cicd-demo.tar

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" && test -n "$EC2_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USERNAME"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes ec2-cicd-demo.tar "$EC2_USERNAME@$EC2_HOST:~/ec2-cicd-demo.tar"

      - name: Deploy and check on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$EC2_USERNAME@$EC2_HOST" "docker load --input ~/ec2-cicd-demo.tar && (docker rm --force ec2-cicd-demo >/dev/null 2>&1 || true) && docker run --detach --restart unless-stopped --name ec2-cicd-demo --publish 80:8000 ec2-cicd-demo:$IMAGE_TAG && rm ~/ec2-cicd-demo.tar"
          for attempt in {1..20}; do
            if curl --fail --silent "http://$EC2_HOST/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "The deployment did not become healthy." >&2
          exit 1
